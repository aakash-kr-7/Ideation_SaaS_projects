name: Release candidate gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local backend
        run: npx supabase start
      - name: Export local backend credentials
        shell: bash
        run: |
          npx supabase status -o env >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$(npx supabase status -o env | sed -n 's/^API_URL=\"\\(.*\\)\"$/\\1/p')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(npx supabase status -o env | sed -n 's/^ANON_KEY=\"\\(.*\\)\"$/\\1/p')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=\"\\(.*\\)\"$/\\1/p')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(npx supabase status -o env | sed -n 's/^API_URL=\"\\(.*\\)\"$/\\1/p')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npx supabase status -o env | sed -n 's/^ANON_KEY=\"\\(.*\\)\"$/\\1/p')" >> "$GITHUB_ENV"
      - name: Serve production Edge Functions
        run: npx supabase functions serve --no-verify-jwt &
      - name: Canonical release gate
        run: npm run release:check
      - name: Attach immutable live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shouldbuild-release-proof
          path: |
            artifacts/browser/
            artifacts/hybrid-audit/
          if-no-files-found: error
